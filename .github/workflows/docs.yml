name: Docs

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly rebuild: refreshes package versions, repository activity and test suite results
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance:
    uses: ./.github/workflows/conformance.yml

  issues:
    # Opens, updates and closes the issues of implementations that fail the test suite
    # (see conformance/issues.mjs) in the implementations' own repositories. That needs the
    # ISSUES_TOKEN secret: a classic personal access token with the public_repo scope, since
    # the workflow's token can't write to other repositories. Pull requests and other branches
    # only show in the job summary what would happen.
    needs: conformance
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: conformance
          path: ${{ runner.temp }}/current

      - uses: actions/download-artifact@v8
        # Missing when livr-spec.org couldn't be reached: issues.mjs then fails without touching the issues
        continue-on-error: true
        with:
          name: previous-conformance
          path: ${{ runner.temp }}/previous

      - name: Update the issues
        env:
          GITHUB_TOKEN: ${{ secrets.ISSUES_TOKEN || secrets.GITHUB_TOKEN }}
        run: >-
          node conformance/issues.mjs
          "${{ runner.temp }}/current/conformance.json"
          "${{ runner.temp }}/previous/previous.json"
          ${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/master') && '--dry-run' || '' }}

  build:
    needs: conformance
    # Build the site even if some implementations could not be tested
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # "Last updated" dates come from git history

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check that README.md is in sync with docs/data/implementations.json
        run: npm run readme:check

      - name: Download test suite results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: conformance
          path: docs/data

      - name: Build
        run: npm run docs:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
