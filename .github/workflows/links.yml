name: Links

on:
  schedule:
    - cron: '0 7 * * 1'
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/data/*.json'
      - 'lychee.toml'
      - '.github/workflows/links.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress --root-dir "${{ github.workspace }}/docs" './**/*.md' './docs/data/*.json'
          fail: ${{ github.event_name == 'pull_request' }}

      - name: Report broken links in an issue
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken links report
          content-filepath: ./lychee/out.md
          labels: broken links
